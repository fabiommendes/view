[package]
name = "view"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
infer = "0.22.0"
mime_guess = "2.0.5"
serde-saphyr = "2.0.0"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
terminal_size = "0.4.4"
toml = { version = "1.1.8", features = ["preserve_order"] }

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libc = "0.2.190"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
