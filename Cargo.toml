[package]
name = "view-cli"
version = "0.1.0"
edition = "2024"
description = "Open files, URLs and stdin in the right terminal viewer, inside a pager"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/fabiommendes/view"
keywords = ["cli", "viewer", "pager", "terminal", "preview"]
categories = ["command-line-utilities"]
exclude = ["dev/", "tests/", "justfile", "AGENTS.md", "CLAUDE.md"]

[[bin]]
name = "view"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
comfy-table = "8.0.1"
csv = "1.4.0"
fluent-bundle = "0.16.0"
htmd = "0.5.6"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
infer = "0.22.0"
libc = "0.2.190"
mime_guess = "2.0.5"
resvg = "0.48.1"
serde-saphyr = "2.0.0"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
terminal_size = "0.4.4"
toml = { version = "1.1.8", features = ["preserve_order"] }
unic-langid = "0.9.6"
ureq = "3.4.2"

[dev-dependencies]
serde_json = { version = "1.0.154", features = ["preserve_order"] }
